'use strict';const c=document.getElementById('c'),ctx=c.getContext('2d'),$=s=>document.getElementById(s);let W=1200,H=840,S=1,OX=0,OY=0;function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;S=Math.min(c.width/W,c.height/H);OX=(c.width-W*S)/2;OY=(c.height-H*S)/2}onresize=resize;resize();let day=1,time=360,stress=12,money=12,clean=90,score=0,meal=false,meds={am:false,pm:false},bedtime=false,shiftDone=false,modalOpen=false,events=[],lastEvent=380,notice='Welcome to ASPEN. Bailey arrives in his silver car for the 6 AM shift.',msgUntil=0,keys={},hold='',p={x:620,y:675},mike=false,mikeSmoke=0,nightBathroom=0,derrickCall=false,derrickLast=370,mail=false,carArrived=false;let residents=[{id:'JV',x:772,y:450,room:[975,225],issue:'',mood:80,toy:'basketball',bed:false,color:'#25282d',skin:'#bf8d68'},{id:'MJ',x:1035,y:575,room:[1040,575],issue:'',mood:85,bed:false,color:'#d3bba0',skin:'#d1a07c'},{id:'CH',x:170,y:240,room:[170,240],issue:'',mood:78,bed:false,color:'#d8aa50',skin:'#c58e72'}];let npcRoutes={MJ:{route:[],i:0,wait:0},CH:{route:[],i:0,wait:0},JV:{route:[],i:0,wait:0}};const D={id:'Derrick',x:230,y:420},toy={x:670,y:365};const areas=[['CH ROOM',110,205,220,145,'#5d514d'],['OFFICE',110,355,245,160,'#55473e'],['STAFF BATH',110,525,120,120,'#84959c'],['LAUNDRY',230,525,150,120,'#9b9c92'],['KITCHEN',380,525,475,120,'#b19b7b'],['LIVING ROOM',355,205,565,310,'#926b4d'],['JV ROOM',925,205,220,145,'#635e64'],['CLIENT BATH',1030,365,115,115,'#84989b'],['MJ ROOM',925,495,220,150,'#69635f']];function r(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}function text(s,x,y,size=13,color='#f4e6c8',align='left'){ctx.fillStyle=color;ctx.font=`bold ${size}px system-ui`;ctx.textAlign=align;ctx.fillText(s,x,y)}function line(x,y,X,Y,color='#302c29',width=6){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(X,Y);ctx.stroke()}function circ(x,y,rad,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);ctx.fill()}function fmt(){let m=Math.floor(time)%1440;return `${Math.floor(m/60)%12||12}:${String(m%60).padStart(2,'0')} ${m<720?'AM':'PM'}`}function say(s){notice=s;msgUntil=performance.now()+6500;$('log').textContent=s}function modal(title,options){modalOpen=true;const m=$('modal');m.style.display='block';m.replaceChildren();const h=document.createElement('h2');h.textContent=title;m.append(h);options.forEach(([s,fn])=>{let b=document.createElement('button');b.textContent=s;b.onclick=()=>{m.style.display='none';modalOpen=false;fn()};m.append(b)})}function closeOption(){return ['Close',()=>{}]};function advance(n){let old=time;time+=n;if(old<960&&time>=960)say('4 PM: Start dinner. Cooking takes an hour.');if(old<1260&&time>=1260){bedtime=true;residents.forEach(q=>{q.bed=true;q.issue='';q.x=q.room[0];q.y=q.room[1]});say('9 PM: Everyone goes to bed. Finally, a quiet house.')}if(old<1200&&time>=1200)say('8 PM: The sky darkens and the porch lamps switch on.');if(old<1320&&time>=1320)arrive();while(time>lastEvent&&lastEvent<1260){if(Math.random()<.66){const q=residents[Math.floor(Math.random()*3)];if(!q.issue){q.issue=q.id==='JV'?'toy':q.id==='MJ'?'instructions':'argument';q.mood-=20;say(q.id+' is upset! Find them and talk to them.')}}if(Math.random()<.5){events.push({type:'bath',x:1080,y:420});clean-=5}if(Math.random()<.2)events.push({type:'dishes',x:660,y:585});if(Math.random()<.48&&time>dernNext()){derrickCall=true;say('Derrick wants Bailey in his office for another question.');}lastEvent+=45+Math.random()*45}if(time>=1320&&mike){let count=Math.floor((time-1320)/60);if(count>mikeSmoke){mikeSmoke=count;say('Mike steps onto the porch for another cigarette, then returns to the glowing TV.')}if(count>nightBathroom){nightBathroom=count;const q=residents[Math.floor(Math.random()*3)];say(q.id+' gets up to use the client bathroom, then goes back to bed.')}}clean=Math.max(0,clean)}function dernNext(){return derrickLast+80}function arrive(){mike=true;carArrived=true;say('10 function npcMove(q, routeName, dt){const st=npcRoutes[routeName];if(!st.route.length)return;if(st.wait>0){st.wait-=dt;return}let goal=st.route[st.i],dx=goal[0]-q.x,dy=goal[1]-q.y,dist=Math.hypot(dx,dy);if(dist<5){st.i=(st.i+1)%st.route.length;st.wait=goal[2]||0;return}let step=Math.min(dist,dt*65);q.x+=dx/dist*step;q.y+=dy/dist*step;q.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?2:1):(dy>0?3:0);q.walking=true}
