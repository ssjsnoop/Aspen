<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta charset="utf-8"><title>ASPEN — The House</title><style>html,body{margin:0;background:#151b27;color:#fff;font-family:system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#ui{position:fixed;inset:0;pointer-events:none}button{pointer-events:auto;background:#24374d;color:white;border:2px solid #91b6d1;border-radius:12px;padding:12px;font-weight:bold}#actions{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:7px;max-width:48vw}#move{position:absolute;left:12px;bottom:14px;display:grid;grid-template-columns:repeat(3,52px);gap:4px}#move button{height:48px;padding:0;font-size:22px}#message{position:absolute;top:68px;left:50%;transform:translateX(-50%);width:min(650px,90vw);text-align:center;background:#101c2cdd;border:1px solid #9eb9cb;border-radius:12px;padding:9px;font-size:14px}#choices{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(450px,88vw);background:#172537;border:2px solid #b8c6d7;border-radius:18px;padding:20px;pointer-events:auto;display:none;box-shadow:0 0 0 100vmax #0008}#choices button{display:block;width:100%;margin-top:8px;text-align:left}#hud{position:absolute;top:8px;left:10px;background:#152436dd;border-radius:12px;padding:9px;font-size:13px}#hint{position:absolute;top:8px;right:10px;font-size:12px;background:#152436dd;padding:9px;border-radius:10px}</style></head><body><canvas id="game"></canvas><div id="ui"><div id="hud"></div><div id="hint">WASD / arrows · E interact · Space task<br>Touch controls below</div><div id="message"></div><div id="move"><span></span><button data-dir="up">▲</button><span></span><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><div id="actions"><button id="interact">INTERACT</button><button id="task">TASKS / MAP</button></div><div id="choices const c=document.getElementById('game'),g=c.getContext('2d');let W,H,scale,ox,oy;function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;scale=Math.min(W/1000,H/650);ox=(W-1000*scale)/2;oy=(H-650*scale)/2}onresize=resize;resize();const $=id=>document.getElementById(id);let day=1,minute=360,money=12,stress=12,score=0,cooking=0,meal=false,phase='play',dialog=false,notice='Welcome to ASPEN. Keep the house running until Mike arrives at 10 PM.',noticeUntil=0,events=[],nextEvent=390,keys={},player={x:460,y:360},residents=[{id:'JV',name:'JV',x:485,y:305,color:'#bb8c66',hair:'bald',mood:0,issue:'',home:[485,305]},{id:'MJ',name:'MJ',x:785,y:480,color:'#d4a37f',hair:'#a58b5a',mood:0,issue:'',home:[785,480]},{id:'CH',name:'CH',x:250,y:115,color:'#c58d70',hair:'#242020',mood:0,issue:'',home:[250,115]},{id:'Carl',name:'Carl',x:765,y:110,color:'#c59c7b',hair:'#5e5148',mood:0,issue:'',home:[765,110]},{id:'Derrick',name:'Derrick',x:225,y:300,color:'#95684e',hair:'#222',mood:0,issue:'',home:[225,300]}];let medsDone={morning:false,evening:false},cleanCount=0,walks=0,parkTrips=0,messes=[],activityUntil=0;let toy={x:730,y:160,found:false},rules=['Derrick wants the living room spotless.','Derrick says dinner must be served early.','Derrick now wants every chair moved back.','Derrick changed the schedule. Again.'],rule=0;const rooms=[['CH ROOM',105,70,245,145,'#796b65'],['OFFICE',105,225,155,110,'#778591'],['STAFF BATH',105,345,155,105,'#90a5ac'],['LIVING ROOM',270,225,380,325,'#b18a60'],['JV ROOM',665,70,230,145,'#807e89'],['CLIENT BATH',665,225,230,110,'#91a7ae'],['MJ ROOM',665,345,230,205,'#777d87'],['KITCHEN / BACK',105,460,155,90,'#a48e6f']];function say(t){notice=t;noticeUntil=performance.now()+7000}function fmt(){let m=Math.floor(minute)%1440;return `${Math.floor(m/60)%12||12}:${String(m%60).padStart(2,'0')} ${m<720?'AM':'PM'}`}function modal(title,opts){dialog=true;let el=$('choices');el.style.display='block';el.innerHTML='<h2 style="margin:0 0 10px">'+title+'</h2>';opts.forEach(([label,fn])=>{let b=document.createElement('button');b.textContent=label;b.onclick=()=>{el.style.display='none';dialog=false;fn()};el.appendChild(b)})}function taskList(){modal('SHIFT BOARD — '+fmt(),[['Medication chart / pass meds',medicationRound],['Clean house / bathroom',cleanMenu],['Go for neighborhood walk',()=>outing(false)],['Take residents to the park',()=>outing(true)],['Shift report',report],['Check residents and current problems',()=>say(residents.filter(r=>r.issue).map(r=>r.name+': '+r.issue).join(' | ')||'Everyone is settled. For now.')],['House rules',()=>say(rules[rule%rules.length])],['Close',()=>{}]])}function medicationRound(){let period=minute<840?'morning':'evening';if(medsDone[period]){say('The '+period+' medication round is already documented.');return}modal('MEDICATION ROUND — '+period.toUpperCase(),[['Verify resident, medication chart, and scheduled dose',()=>modal('Medication safety check',[['Confirm the chart and record completed administration',()=>{medsDone[period]=true;score+=25;minute+=25;say('Medication round recorded. Check the chart for any outstanding orders.');advance()}],['Hold and report a discrepancy',()=>{score+=5;say('Medication held and discrepancy flagged for follow-up.')}],['Cancel',()=>{}]])],['Back',()=>{}]])}

function clean(area){minute+=area==='bathroom'?20:area==='dishes'?15:25;let n=messes.filter(m=>m.area===area).length;messes=messes.filter(m=>m.area!==area);cleanCount++;score+=10+n*10;stress=Math.max(0,stress-3);say('Bailey cleaned the '+area+(n?' and cleared '+n+' mess(es).':'')+'.');advance()}

ns',()=>{issue(near);say('MJ throws a shoe and spits! He needs calming music.')}],['Play a Beach Boys-style sunny surf tune ♪',()=>{solve(near);say('♪ Sunny harmonies fill the house. MJ relaxes and goes quiet.')}],['Leave him alone',()=>say('MJ remains quiet.')]]);else if(near.id==='CH')modal('CH — wants soda and money',[['Give him a soda',()=>{solve(near);say('CH: “Why you being rude?” He heads to his room anyway.')}],['Say no',()=>{solve(near);stress+=4;say('CH: “I’m stupid!” He goes to his room.')}],['Give him money ($2)',()=>{money=Math.max(0,money-2);solve(near);say('CH: “Why you being rude?” He goes to his room.')}]]);else if(near.id==='Carl')modal('Carl — ready to argue',[['Give Carl a dollar',()=>{if(money>=1){money--;solve(near);say('Carl takes the dollar and goes to his room for a while.')}else say('You have no money left.')}],['Try to win the argument',()=>{stress+=6;say('Carl loses track of his own argument, but keeps going.')}],['Walk away',()=>say('Carl argues with the empty hallway.')]]);else modal('Derrick — the boss',[['Agree with Derrick',()=>{rule++;stress+=5;say('Derrick: “No, that’s wrong. We’re doing it differently now.” '+rules[rule%rules.length])}],['Disagree with Derrick',()=>{rule++;stress+=5;say('Derrick: “Wrong. I changed my mind.” '+rules[rule%rules.length])}],['Ask for clarification',()=>{rule++;stress+=5;say('Derrick: “You should already know.” '+rules[rule%rules.length])}]])}function advance(){while(minute>=nextEvent&&minute<1320){let options=residents.filter(r=>r.id!=='Derrick'&&!r.issue);if(options.length)issue(options[Math.floor(Math.random()*options.length)]);else if(Math.random()<.4)issue(residents[4]);if(Math.random()<.65)bathroomEvent();if(Math.random()<.32)messes.push({area:Math.random()<.5?'dishes':'living room',who:'house'});nextEvent+=65+Math.random()*80}if(minute>=1320&&phase==='play')endDay()}function endDay(){phase='ending';modal('10:00 PM — MIKE ARRIVES 🚗',[[ 'Watch Mike arrive',()=>{say('Mike pulls up in his expensive red sports car, steps out in his green sweater and gray sweatpants, smokes outside and chats. “Everybody leave.”');modal('END OF SHIFT — MIKE',[[ 'See shift results',()=>{let bonus=Math.max(0,100-Math.floor(stress))+score+(medsDone.morning?25:0)+(medsDone.evening?25:0)-messes.length*8;modal('DAY '+day+' COMPLETE',[[ 'Score '+bonus+' · Pay $'+(40+Math.floor(bonus/10))+' · Next day',()=>{money+=40+Math.floor(bonus/10);day++;minute=360;stress=Math.max(5,stress-22);score=0;meal=false;medsDone={morning:false,evening:false};messes=[];cleanCount=0;walks=0;parkTrips=0;phase='play';nextEvent=390;residents.forEach(r=>{r.issue='';r.mood=0;r.x=r.home[0];r.y=r.home[1]});toy.found=false;say('New day. Same house. Different problems.')} ]])} ]])} ]])}

g.setTransform(1,0,0,1,0,0);g.fillStyle='#101a24';g.fillRect(0,0,W,H);g.setTransform(scale,0,0,scale,ox,oy);

g.fillStyle='#b18a60';for(let y of [180,275,395,495])g.fillRect(255,y,19,50);for(let y of [166,265,435])g.fillRect(649,y,20,50);g.fillRect(423,541,95,15);

let last=performance.now(),held=null;function loop(t){let dt=Math.min(.06,(t-last)/1000);last=t;if(phase==='play'&&!dialog){let dx=(keys.ArrowRight||keys.d||held==='right'?1:0)-(keys.ArrowLeft||keys.a||held==='left'?1:0),dy=(keys.ArrowDown||keys.s||held==='down'?1:0)-(keys.ArrowUp||keys.w||held==='up'?1:0);let len=Math.hypot(dx,dy)||1;player.x=Math.max(100,Math.min(895,player.x+dx/len*210*dt));player.y=Math.max(75,Math.min(550,player.y+dy/len*210*dt));minute+=dt*3.8;advance()}render();requestAnimationFrame(loop)}requestAnimationFrame(loop);onkeydown=e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==='e')interact();if(e.key===' ')taskList()};onkeyup=e=>keys[e.key]=false;document.querySelectorAll('[data-dir]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();held=b.dataset.dir;b.setPointerCapture(e.pointerId)};b.onpointerup=b.onpointercancel=()=>held=null});$('interact').onclick=interact;$('task').onclick=taskList;setTimeout(()=>modal('WELCOME TO ASPEN',[['Start Bailey’s 6 AM shift',()=>say('Cook, pass meds, clean bathroom messes, take walks and park trips, help residents, and beware Derrick. Mike arrives at 10 PM.')],['How to play',()=>say('Move with arrows/WASD or touch. TASKS opens medications, cleaning, walks, park visits, and shift reports. Cooking advances one hour.')]]),350);
